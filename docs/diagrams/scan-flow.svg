<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 780" width="740" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>How a MyKad scan works</title>
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #8c959f; stroke-dasharray: 6 4; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .app { fill: #eef6ff; stroke: #4a7fd6; }
    .inner { fill: #ffffff; stroke: #4a7fd6; }
    .ext { fill: #f5f0fc; stroke: #8a63d2; }
    .hw { fill: #fff8e6; stroke: #bf8700; }
    .pill { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; }
    .h { fill: #1f2328; font-weight: 600; font-size: 15px; }
    .m { fill: #59636e; }
    .s { font-size: 12px; }
    .ok { fill: #1a7f37; }
    .no { fill: #cf222e; }
    .ln { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ret { stroke: #59636e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .ah { fill: #59636e; }
    .num { fill: #4a7fd6; }
    .numt { fill: #ffffff; font-weight: 600; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { stroke: #6e7681; }
      .box { fill: #161b22; stroke: #30363d; }
      .app { fill: #0f2540; stroke: #4a8ae0; }
      .inner { fill: #0d1117; stroke: #4a8ae0; }
      .ext { fill: #231a36; stroke: #a383e0; }
      .hw { fill: #2b2111; stroke: #d29922; }
      .pill { fill: #0d1117; stroke: #30363d; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ok { fill: #3fb950; }
      .no { fill: #f85149; }
      .ln, .ret { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .num { fill: #4a8ae0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="740" height="780"/>

  <!-- Front-desk PC frame -->
  <rect class="frame" x="20" y="20" width="700" height="610" rx="12"/>
  <text class="m s" x="36" y="42">Front-desk PC · Windows 10/11 or macOS 15+</text>

  <!-- Browser -->
  <rect class="box" x="50" y="58" width="640" height="122" rx="10"/>
  <text class="h" x="70" y="84">Browser · app.estatell.com</text>
  <text class="t" x="70" y="108">Check-in / guest form</text>
  <rect class="pill" x="70" y="122" width="150" height="26" rx="13"/>
  <circle class="ok" cx="86" cy="135" r="5"/>
  <text class="t s" x="98" y="139">Ready for MyKad</text>
  <text class="m s" x="240" y="139">useMykadReader</text>
  <text class="m s" x="70" y="166">Polls /status every 2.5 s while the MyKad box is open</text>

  <!-- Browser -> bridge arrows -->
  <line class="ln" x1="150" y1="180" x2="150" y2="266" marker-end="url(#a)"/>
  <circle class="num" cx="150" cy="210" r="9"/><text class="numt" x="150" y="214" text-anchor="middle">1</text>
  <text class="t s" x="166" y="214">GET /status</text>
  <text class="m s" x="166" y="230">reader, card</text>

  <line class="ln" x1="400" y1="180" x2="400" y2="266" marker-end="url(#a)"/>
  <circle class="num" cx="400" cy="210" r="9"/><text class="numt" x="400" y="214" text-anchor="middle">2</text>
  <text class="t s" x="416" y="214">GET /read</text>
  <text class="m s" x="416" y="230">Origin: app.estatell.com</text>

  <line class="ret" x1="610" y1="266" x2="610" y2="184" marker-end="url(#a)"/>
  <text class="m s" x="620" y="230">card data</text>

  <!-- MyKad Reader app -->
  <rect class="app" x="50" y="270" width="640" height="250" rx="10"/>
  <text class="h" x="70" y="296">MyKad Reader · .NET 10 AOT</text>
  <text class="m s" x="670" y="296" text-anchor="end">127.0.0.1:9292 only · tray: reader, card, Estatell seen</text>

  <rect class="pill" x="70" y="310" width="180" height="28" rx="14"/>
  <text class="t s" x="84" y="328">Host check</text>
  <text class="no s" x="236" y="328" text-anchor="end">✗ 403</text>
  <rect class="pill" x="270" y="310" width="180" height="28" rx="14"/>
  <text class="t s" x="284" y="328">Origin check</text>
  <text class="no s" x="436" y="328" text-anchor="end">✗ 403</text>
  <rect class="pill" x="470" y="310" width="200" height="28" rx="14"/>
  <text class="t s" x="484" y="328">/read needs Origin</text>
  <text class="no s" x="656" y="328" text-anchor="end">✗ 403</text>

  <rect class="inner" x="70" y="356" width="600" height="146" rx="8"/>
  <text class="h" x="88" y="382">Estatell.MyKad · card logic</text>
  <text class="t" x="88" y="410">SELECT JPN app · READ files 1-1, 1-2, 1-4</text>
  <text class="t" x="88" y="434">Name · IC number · date of birth · gender</text>
  <text class="t" x="88" y="458">Address → LHDN state code</text>
  <text class="t" x="88" y="482">Portrait → base64 JPEG</text>
  <text class="m s" x="652" y="482" text-anchor="end">memory only, cleared after reply</text>

  <!-- OS PC/SC -->
  <line class="ln" x1="370" y1="520" x2="370" y2="550" marker-end="url(#a)"/>
  <text class="m s" x="380" y="540">PC/SC</text>
  <rect class="box" x="50" y="554" width="640" height="52" rx="10"/>
  <text class="t" x="370" y="577" text-anchor="middle">OS smart-card service</text>
  <text class="m s" x="370" y="595" text-anchor="middle">winscard.dll (Windows) · PCSC.framework (macOS)</text>

  <!-- Hardware -->
  <line class="ln" x1="280" y1="606" x2="280" y2="666" marker-end="url(#a)"/>
  <text class="m s" x="290" y="650">USB, no driver</text>
  <rect class="hw" x="190" y="670" width="180" height="56" rx="10"/>
  <text class="h" x="280" y="694" text-anchor="middle">ACR39U reader</text>
  <text class="m s" x="280" y="712" text-anchor="middle">USB contact reader</text>
  <line class="ln" x1="374" y1="698" x2="456" y2="698" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="hw" x="460" y="670" width="180" height="56" rx="10"/>
  <text class="h" x="550" y="694" text-anchor="middle">MyKad chip</text>
  <text class="m s" x="550" y="712" text-anchor="middle">JPN application</text>

  <text class="m s" x="370" y="752" text-anchor="middle">Form fills → staff check → save → Estatell server validates and stores.</text>
  <text class="m s" x="370" y="770" text-anchor="middle">MyKad Reader never calls the server.</text>
</svg>
