<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Connecting a computer to a hotel</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .app { fill: #eef6ff; stroke: #4a7fd6; }
    .ext { fill: #f5f0fc; stroke: #8a63d2; }
    .note { fill: #fff8e6; stroke: #bf8700; }
    .done { fill: #dafbe1; stroke: #1a7f37; }
    .life { stroke: #8c959f; stroke-dasharray: 4 5; }
    .t { fill: #1f2328; }
    .h { fill: #1f2328; font-weight: 600; font-size: 15px; }
    .m { fill: #59636e; }
    .s { font-size: 12px; }
    .ln { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ret { stroke: #59636e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .ah { fill: #59636e; }
    .num { fill: #4a7fd6; }
    .numt { fill: #ffffff; font-weight: 600; font-size: 12px; }
    .rule { fill: #f6f8fa; stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box, .rule { fill: #161b22; stroke: #30363d; }
      .app { fill: #0f2540; stroke: #4a8ae0; }
      .ext { fill: #231a36; stroke: #a383e0; }
      .note { fill: #2b2111; stroke: #d29922; }
      .done { fill: #12261a; stroke: #3fb950; }
      .life { stroke: #6e7681; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ln, .ret { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .num { fill: #4a8ae0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="660"/>

  <!-- Participants -->
  <rect class="box" x="60" y="24" width="220" height="56" rx="10"/>
  <text class="h" x="170" y="48" text-anchor="middle">Admin's browser</text>
  <text class="m s" x="170" y="66" text-anchor="middle">Settings › MyKad Reader</text>

  <rect class="ext" x="370" y="24" width="220" height="56" rx="10"/>
  <text class="h" x="480" y="48" text-anchor="middle">Estatell server</text>
  <text class="m s" x="480" y="66" text-anchor="middle">mykad_devices</text>

  <rect class="app" x="680" y="24" width="220" height="56" rx="10"/>
  <text class="h" x="790" y="48" text-anchor="middle">MyKad Reader</text>
  <text class="m s" x="790" y="66" text-anchor="middle">127.0.0.1:9292</text>

  <!-- Lifelines -->
  <line class="life" x1="170" y1="80" x2="170" y2="540"/>
  <line class="life" x1="480" y1="80" x2="480" y2="540"/>
  <line class="life" x1="790" y1="80" x2="790" y2="540"/>

  <!-- 1 status -->
  <circle class="num" cx="150" cy="118" r="9"/><text class="numt" x="150" y="122" text-anchor="middle">1</text>
  <line class="ln" x1="170" y1="118" x2="786" y2="118" marker-end="url(#a)"/>
  <text class="t s" x="200" y="110">GET /status</text>
  <line class="ret" x1="790" y1="150" x2="174" y2="150" marker-end="url(#a)"/>
  <text class="m s" x="760" y="142" text-anchor="end">{ device_id, connected: false }</text>

  <!-- Admin names the PC -->
  <rect class="note" x="60" y="168" width="220" height="60" rx="8"/>
  <text class="t s" x="170" y="186" text-anchor="middle">Name: "Front Desk 1"</text>
  <text class="t s" x="170" y="203" text-anchor="middle">Code from tray: 482-917</text>
  <text class="t s" x="170" y="220" text-anchor="middle">[ Connect ]</text>

  <!-- Tray shows the code -->
  <rect class="note" x="680" y="168" width="220" height="44" rx="8"/>
  <text class="t s" x="790" y="186" text-anchor="middle">Tray shows connect code</text>
  <text class="m s" x="790" y="203" text-anchor="middle">in memory only</text>

  <!-- 2 create device -->
  <circle class="num" cx="150" cy="252" r="9"/><text class="numt" x="150" y="256" text-anchor="middle">2</text>
  <line class="ln" x1="170" y1="252" x2="476" y2="252" marker-end="url(#a)"/>
  <text class="t s" x="186" y="244">POST /settings/mykad/devices</text>
  <text class="m s" x="186" y="270">{ device_id, name, os, version }</text>

  <rect class="note" x="370" y="286" width="220" height="44" rx="8"/>
  <text class="t s" x="480" y="304" text-anchor="middle">Create device record</text>
  <text class="t s" x="480" y="321" text-anchor="middle">+ random secret</text>

  <line class="ret" x1="480" y1="356" x2="174" y2="356" marker-end="url(#a)"/>
  <text class="m s" x="460" y="348" text-anchor="end">{ secret }  shown once, never logged</text>

  <!-- 3 pair -->
  <circle class="num" cx="150" cy="400" r="9"/><text class="numt" x="150" y="404" text-anchor="middle">3</text>
  <line class="ln" x1="170" y1="400" x2="786" y2="400" marker-end="url(#a)"/>
  <text class="t s" x="200" y="392">POST /pair { secret, code, hotel }</text>

  <rect class="note" x="680" y="416" width="220" height="44" rx="8"/>
  <text class="t s" x="790" y="434" text-anchor="middle">Check code, store SHA-256(secret)</text>
  <text class="m s" x="790" y="451" text-anchor="middle">shared file for all users</text>

  <line class="ret" x1="790" y1="486" x2="174" y2="486" marker-end="url(#a)"/>
  <text class="m s" x="760" y="478" text-anchor="end">{ connected: true }</text>

  <!-- Done -->
  <rect class="done" x="40" y="502" width="260" height="44" rx="8"/>
  <text class="t s" x="170" y="520" text-anchor="middle">✓ All set. Insert any MyKad to try it.</text>
  <text class="m s" x="170" y="537" text-anchor="middle">Nothing is saved.</text>

  <!-- Rules -->
  <rect class="rule" x="40" y="566" width="880" height="76" rx="10"/>
  <text class="t s" x="60" y="590">• /pair needs the tray's connect code and works only while not connected. Moving to another hotel means disconnecting first.</text>
  <text class="t s" x="60" y="610">• Disconnect in Estatell → the server stops giving out this computer's token → it stops reading at once.</text>
  <text class="t s" x="60" y="630">• Hotel record lost? Reinstall MyKad Reader, or run it with --reset-pairing.</text>
</svg>
